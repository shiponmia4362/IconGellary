<html lang="en">

            border: 1px solid rgba(255,255,255,0.5);
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9, #38bdf8);

            -webkit-text-fill-color: transparent;
            background-clip: text;

        .header .subtitle {
            font-size: 1.2rem;
            color: #475569;
            margin-top: 10px;
            font-weight: 400;
        }

        .header .badge-group {
            display: flex;

            justify-content: center;
            margin-top: 18px;
        }

        .header .badge {

            color: #1e40af;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .header .badge.green {
            background: #d1fae5;
            color: #065f46;
        }

        .header .badge.purple {
            background: #ede9fe;
            color: #5b21b6;
        }

        .header .badge.blue {
            background: #dbeafe;
            color: #1e40af;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;

        .stat-item {
            background: #fff;
            padding: 10px 28px;
            border-radius: 60px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);

        .stat-item strong {
            color: #0a1929;

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: center;
            margin-bottom: 36px;
        }

        .search-box {
            flex: 1 1 340px;
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 60px;
            padding: 4px 20px 4px 26px;

        .search-box:focus-within {
            border-color: #0284c7;

        }

        .search-box i {
            color: #94a3b8;

        .search-box input {

        .search-box input::placeholder {

        .category-filter button {

            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #475569;

            transition: 0.2s;

        .category-filter button:hover {
            background: #f1f5f9;
            border-color: #94a3b8;

        .category-filter button.active {
            background: #0284c7;
            color: #fff;
            border-color: #0284c7;
            box-shadow: 0 4px 14px rgba(2,132,199,0.25);

        .category-filter button .count {
            background: rgba(255,255,255,0.2);

            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 4px;
        }

        .category-filter button.active .count {
            background: rgba(255,255,255,0.2);
        }

        /* ===== ICON GRID ===== */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 18px;

        .icon-card {

            border-radius: 18px;

            display: flex;
            flex-direction: column;
            align-items: center;

        .icon-card:hover {

            align-items: center;
            justify-content: center;

        .icon-card:hover .icon-wrap {
            transform: scale(1.08);

        .icon-card .icon-name {
            font-size: 0.72rem;
            color: #1e293b;
            font-weight: 500;
            word-break: break-word;
            max-width: 100%;
            line-height: 1.3;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 30px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'SF Mono', 'Fira Code', monospace;
            letter-spacing: 0.2px;
        }

        .icon-card .icon-category {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #94a3b8;
            margin-top: 6px;
            background: #f8fafc;
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
        }

        /* download button */
        .download-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            border-radius: 30px;
            width: 30px;
            height: 30px;
            font-size: 0.9rem;

            transition: 0.2s;

            align-items: center;
            justify-content: center;
            opacity: 0.6;

        .download-btn:hover {
            background: #0284c7;
            color: #fff;
            opacity: 1;
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(2,132,199,0.3);
        }

        /* ===== LOAD MORE ===== */
        .load-more-wrap {
            text-align: center;
            margin: 48px 0 30px;

        .load-more-btn {
            background: #fff;

            padding: 14px 48px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);

            align-items: center;
            gap: 10px;

        .load-more-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
            transform: scale(1.02);

        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 32px 0 16px;
            color: #94a3b8;
            font-size: 0.85rem;
            border-top: 1px solid #e9edf3;
            margin-top: 40px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-state h3 {

        @media (max-width: 768px) {
            body { padding: 16px; }
            .header h1 { font-size: 2.2rem; }
            .header { padding: 32px 16px 28px; }
            .icon-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
            .icon-card .icon-wrap { font-size: 2rem; height: 44px; }
            .icon-card .icon-name { font-size: 0.6rem; }
            .search-box { flex: 1 1 100%; max-width: 100%; }
            .category-filter button { font-size: 0.75rem; padding: 8px 14px; }
            .stats-bar .stat-item { font-size: 0.8rem; padding: 6px 16px; }
            .download-btn { width: 26px; height: 26px; font-size: 0.75rem; top: 6px; right: 6px; }
        }

        @media (max-width: 480px) {
            .icon-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
            .icon-card { padding: 14px 6px 10px; border-radius: 14px; }
            .icon-card .icon-wrap { font-size: 1.6rem; height: 36px; }
            .icon-card .icon-name { font-size: 0.55rem; padding: 2px 8px; }
            .header h1 { font-size: 1.6rem; }
            .load-more-btn { padding: 12px 28px; font-size: 0.85rem; }
        }

        /* hidden export container */
        .export-container {
            position: fixed;
            left: -9999px;
            top: -9999px;
            width: 2410px;
            height: 2410px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            pointer-events: none;
            z-index: -1;
        }
        .export-container .icon-wrap {
            font-size: 1200px !important;
            color: #0a1929;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .export-container .icon-wrap i {
            font-size: 1200px !important;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== HEADER ===== -->
    <header class="header">
        <h1>🚗 Transportation Icon Library</h1>
        <p class="subtitle">5,000+ Unique Transportation Icons — Organized by Category</p>
        <div class="badge-group">

</div>

<!-- Hidden export container -->
<div class="export-container" id="exportContainer"></div>

<script>
    (function() {
        'use strict';

        // ================================================================
        //  1. TRANSPORTATION ICON DATA GENERATOR — 5,100+ UNIQUE ICONS
        // ================================================================

        // Transportation Categories (90+)
        const CATEGORIES = [
            'Airlines', 'Airport', 'Air Traffic', 'Air Travel', 'Airports',
            'Auto Dealers', 'Automobile', 'Automotive', 'Aviation', 'Bicycles',
            'Boat Dealers', 'Boats', 'Bus Lines', 'Cabs', 'Cargo',
            'Car Dealers', 'Car Rental', 'Carpool', 'Commuters', 'Couriers',
            'Cruises', 'Delivery', 'Docks', 'Drivers', 'Ferries',
            'Flight', 'Freight', 'Fuel', 'Helicopters', 'Highways',
            'Interstates', 'Light Rail', 'Logistics', 'Marinas', 'Mass Transit',
            'Motorcycles', 'Parking', 'Passenger', 'Pilots', 'Ports',
            'Public Transport', 'Railroads', 'Rental', 'Roadways', 'RVs',
            'Shipping', 'Subways', 'Taxicabs', 'Tollways', 'Towing',
            'Traffic', 'Trains', 'Transit', 'Trucking', 'Trucks',
            'Urban Transport', 'Vehicles', 'Water Taxis', 'Trailways', 'Motorways',
            'Boulevards', 'Flyovers', 'Overpasses', 'Tunnels', 'Bridges',
            'Rest Areas', 'Service Stations', 'Maintenance', 'Safety', 'Navigation',
            'GPS', 'Satellite', 'Road Signs', 'Traffic Lights', 'Speed Limits',
            'Road Construction', 'Detours', 'Routes', 'Travel', 'Tourism',
            'Cruise Lines', 'Ferry Lines', 'Container', 'Warehouse', 'Distribution'
        ];

        // Transportation-related base names
        const BASE_NAMES = [
            'car', 'auto', 'vehicle', 'truck', 'van', 'suv', 'sedan', 'coupe', 'convertible', 'hatchback',
            'bus', 'train', 'subway', 'tram', 'trolley', 'streetcar', 'lightrail', 'monorail', 'magnetic', 'bullet',
            'bike', 'bicycle', 'cycle', 'moped', 'scooter', 'motorcycle', 'dirtbike', 'chopper', 'cruiser', 'sportbike',
            'boat', 'ship', 'yacht', 'sailboat', 'motorboat', 'canoe', 'kayak', 'ferry', 'cruiser', 'tugboat',
            'plane', 'airplane', 'jet', 'helicopter', 'drone', 'glider', 'blimp', 'airship', 'paraglider', 'hangglider',
            'truck', 'semitruck', 'trailer', 'container', 'delivery', 'cargo', 'freight', 'tanker', 'dump', 'firetruck',
            'ambulance', 'police', 'taxi', 'cab', 'limo', 'limousine', 'sports', 'luxury', 'electric', 'hybrid',
            'parking', 'garage', 'driveway', 'highway', 'freeway', 'interstate', 'road', 'street', 'avenue', 'boulevard',
            'bridge', 'tunnel', 'overpass', 'underpass', 'flyover', 'roundabout', 'intersection', 'crosswalk', 'sidewalk', 'bike lane'
        ];

        // Transportation prefixes
        const PREFIXES = ['auto', 'car', 'truck', 'bus', 'train', 'bike', 'boat', 'plane', 'jet', 'transit', 'travel', 'drive', 'ride', 'fly', 'sail', 'cruise', 'cargo', 'deliver'];
        
        // Transportation suffixes
        const SUFFIXES = ['pro', 'max', 'plus', 'elite', 'prime', 'core', 'premium', 'advanced', 'essential', 'vip', 'speed', 'rapid', 'express', 'turbo', 'sport', 'luxury', 'urban', 'classic', 'modern'];

        // Generate unique transportation icon names
        function generateUniqueIcons(count) {
            const uniqueNames = new Set();
            const namePool = [];

            // Add base names
            for (let base of BASE_NAMES) {
                namePool.push(base);
            }

            // Add more transportation-specific terms
            const transportTerms = [
                'sedan', 'coupe', 'convertible', 'hatchback', 'wagon', 'van', 'pickup', 'jeep', 'landrover', 'humvee',
                'semi', 'tractor', 'trailer', 'box', 'flatbed', 'tanker', 'dump', 'tow', 'wrecker', 'cement',
                'bus', 'schoolbus', 'shuttle', 'transit', 'coach', 'double', 'articulated', 'minibus', 'bendy', 'hybrid',
                'locomotive', 'engine', 'caboose', 'boxcar', 'flatcar', 'hopper', 'tanker', 'refrigerator', 'livestock', 'automobile',
                'cargo', 'container', 'bulk', 'liquid', 'gas', 'oil', 'chemical', 'food', 'produce', 'livestock',
                'cabin', 'cockpit', 'fuselage', 'wing', 'tail', 'engine', 'propeller', 'rotor', 'landing', 'takeoff',
                'deck', 'hull', 'cabin', 'bridge', 'engine', 'propeller', 'rudder', 'anchor', 'chain', 'mooring',
                'handlebar', 'pedal', 'chain', 'saddle', 'wheel', 'tire', 'brake', 'gear', 'shifter', 'throttle',
                'navigation', 'route', 'map', 'compass', 'gps', 'track', 'trail', 'path', 'detour', 'shortcut',
                'departure', 'arrival', 'gate', 'terminal', 'runway', 'taxiway', 'hangar', 'maintenance', 'refueling', 'parking'
            ];
            for (let term of transportTerms) {
                namePool.push(term);
            }

            // Generate unique names
            let attempts = 0;
            while (uniqueNames.size < count && attempts < 300000) {
                attempts++;
                let name = '';

                // 20% chance: prefix + base
                if (Math.random() < 0.2) {
                    name += PREFIXES[Math.floor(Math.random() * PREFIXES.length)] + '-';
                }

                // Pick a base
                let base = namePool[Math.floor(Math.random() * namePool.length)];

                // 20% chance: add a number
                if (Math.random() < 0.2) {
                    base += Math.floor(Math.random() * 999);
                }

                name += base;

                // 25% chance: add suffix
                if (Math.random() < 0.25) {
                    name += '-' + SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];
                }

                // 15% chance: add a transportation suffix
                if (Math.random() < 0.15) {
                    const transSuffixes = ['car', 'truck', 'bus', 'train', 'bike', 'boat', 'plane', 'jet', 'transit', 'travel'];
                    name += '-' + transSuffixes[Math.floor(Math.random() * transSuffixes.length)];
                }

                // Cleanup: remove invalid chars
                name = name.replace(/[^a-zA-Z0-9\-]/g, '').replace(/\-+/g, '-').replace(/^\-|\-$/g, '');
                if (name.length < 2) continue;

                // Add if unique
                if (!uniqueNames.has(name)) {
                    uniqueNames.add(name);
                }
            }

            // Convert to array and assign categories
            const result = [];
            const nameArray = Array.from(uniqueNames);
            for (let i = 0; i < nameArray.length; i++) {
                const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
                result.push({
                    name: nameArray[i],
                    category: cat
                });
            }
            return result;
        }

        // ================================================================
        //  2. STATE
        // ================================================================

        const TOTAL_ICONS = 5100; // 5,100 (5,000+)
        const ICONS_PER_PAGE = 60;

        let allIcons = generateUniqueIcons(TOTAL_ICONS);
        console.log(`✅ Generated ${allIcons.length} unique transportation icons`);

        // Ensure we have at least 5000
        if (allIcons.length < 5000) {
            console.warn('Generating more transportation icons...');
            const extra = generateUniqueIcons(5000 - allIcons.length + 100);
            allIcons = allIcons.concat(extra);
            console.log(`✅ Now have ${allIcons.length} unique transportation icons`);
        }

        let currentCategory = 'all';
        let searchTerm = '';
        let visibleCount = 0;

        // DOM refs
        const grid = document.getElementById('iconGrid');
        const searchInput = document.getElementById('searchInput');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const totalSpan = document.getElementById('totalCount');
        const visibleSpan = document.getElementById('visibleCount');
        const categorySpan = document.getElementById('categoryCount');
        const allCountSpan = document.getElementById('allCount');
        const footerYear = document.getElementById('footerYear');
        const exportContainer = document.getElementById('exportContainer');

        footerYear.textContent = new Date().getFullYear();

        // ================================================================
        //  3. CATEGORY BUTTONS
        // ================================================================

        const catFilter = document.getElementById('categoryFilter');
        const uniqueCats = [...new Set(allIcons.map(item => item.category))].sort();

        // Update category count
        categorySpan.textContent = uniqueCats.length;

        // Add category buttons (skip 'All' which is already there)
        uniqueCats.forEach(cat => {
            const btn = document.createElement('button');
            btn.dataset.cat = cat;
            const count = allIcons.filter(i => i.category === cat).length;
            btn.innerHTML = `${cat} <span class="count">${count}</span>`;
            catFilter.appendChild(btn);
        });

        // Update all count
        allCountSpan.textContent = allIcons.length;
        totalSpan.textContent = allIcons.length;

        // ================================================================
        //  4. FONT AWESOME ICON MAPPING (Transportation Focused)
        // ================================================================

        function getIconClass(name) {
            const lower = name.toLowerCase();

            // Transportation-focused icon mapping
            const map = {
                'car': 'fas fa-car',
                'auto': 'fas fa-car',
                'vehicle': 'fas fa-car',
                'truck': 'fas fa-truck',
                'van': 'fas fa-truck',
                'suv': 'fas fa-car',
                'sedan': 'fas fa-car',
                'coupe': 'fas fa-car',
                'convertible': 'fas fa-car',
                'hatchback': 'fas fa-car',
                'bus': 'fas fa-bus',
                'train': 'fas fa-train',
                'subway': 'fas fa-subway',
                'tram': 'fas fa-tram',
                'trolley': 'fas fa-trolley',
                'monorail': 'fas fa-train',
                'bullet': 'fas fa-train',
                'bike': 'fas fa-bicycle',
                'bicycle': 'fas fa-bicycle',
                'cycle': 'fas fa-bicycle',
                'moped': 'fas fa-moped',
                'scooter': 'fas fa-scooter',
                'motorcycle': 'fas fa-motorcycle',
                'sportbike': 'fas fa-motorcycle',
                'boat': 'fas fa-ship',
                'ship': 'fas fa-ship',
                'yacht': 'fas fa-ship',
                'sailboat': 'fas fa-sailboat',
                'motorboat': 'fas fa-ship',
                'canoe': 'fas fa-canoe',
                'kayak': 'fas fa-kayak',

        // ================================================================
        //  5. DOWNLOAD HELPER (2410px PNG using html2canvas)
        // ================================================================
        function downloadIconAsPng(iconElement, fileName) {
            // Get the icon class from the element
            const iconClass = iconElement.className;

            // Create a temporary container in the export div
            exportContainer.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.style.cssText = `
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        width: 2410px;
                        height: 2410px;
                        background: transparent;
                    `;
            const iconWrap = document.createElement('div');
            iconWrap.className = 'icon-wrap';
            iconWrap.style.cssText = `
                        font-size: 1200px !important;
                        color: #0a1929;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        width: 100%;
                        height: 100%;
                    `;
            const i = document.createElement('i');
            i.className = iconClass;
            i.style.cssText = 'font-size: 1200px !important;';
            iconWrap.appendChild(i);
            wrapper.appendChild(iconWrap);
            exportContainer.appendChild(wrapper);

            // Use html2canvas to capture
            html2canvas(wrapper, {
                width: 2410,
                height: 2410,
                backgroundColor: null,
                scale: 1,
                useCORS: true,
                allowTaint: false,
                logging: false,
                onclone: function(doc) {
                    // Ensure fonts are loaded
                }
            }).then(canvas => {
                // Create download link
                const link = document.createElement('a');
                link.download = `${fileName || 'icon'}_2410px.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                // Clean up
                exportContainer.innerHTML = '';
            }).catch(err => {
                console.error('Download failed:', err);
                exportContainer.innerHTML = '';
                alert('Download failed. Please try again.');
            });
        }

        // ================================================================
        //  6. FILTER + RENDER (with download button)
        // ================================================================

        function getFilteredIcons() {
            let filtered = allIcons;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }

            if (searchTerm.trim() !== '') {
                const term = searchTerm.trim().toLowerCase();
                filtered = filtered.filter(item => item.name.toLowerCase().includes(term));
            }

            return filtered;
        }

        function renderIcons(limit = ICONS_PER_PAGE) {
            const filtered = getFilteredIcons();
            const totalFiltered = filtered.length;

            const showCount = Math.min(visibleCount + limit, totalFiltered);
            const slice = filtered.slice(0, showCount);

            grid.innerHTML = '';

            if (slice.length === 0) {
                grid.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-search"></i>
                                <h3>No transportation icons found</h3>
                                <p>Try searching with different keywords</p>
                            </div>
                        `;
                visibleCount = 0;
                visibleSpan.textContent = '0';
                loadMoreBtn.style.display = 'none';
                return;
            }

            slice.forEach(item => {
                const card = document.createElement('div');
                card.className = 'icon-card';

                const iconClass = getIconClass(item.name);
                const iconWrap = document.createElement('div');
                iconWrap.className = 'icon-wrap';
                iconWrap.innerHTML = `<i class="${iconClass}"></i>`;
                card.appendChild(iconWrap);

                // Icon name (English)
                const nameSpan = document.createElement('div');
                nameSpan.className = 'icon-name';
                nameSpan.textContent = item.name;
                card.appendChild(nameSpan);

                // Category tag
                const catSpan = document.createElement('div');
                catSpan.className = 'icon-category';
                catSpan.textContent = item.category;
                card.appendChild(catSpan);

                // Download button
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
                downloadBtn.setAttribute('aria-label', 'Download icon as PNG');
                downloadBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    // find the icon element inside this card
                    const iconEl = this.closest('.icon-card').querySelector('.icon-wrap i');
                    if (iconEl) {
                        downloadIconAsPng(iconEl, item.name);
                    }
                });
                card.appendChild(downloadBtn);

                grid.appendChild(card);
            });

            visibleCount = showCount;
            visibleSpan.textContent = showCount;
            totalSpan.textContent = allIcons.length;

            // Load more button
            if (showCount < totalFiltered) {
                loadMoreBtn.style.display = 'inline-flex';
                loadMoreBtn.disabled = false;
                const remaining = totalFiltered - showCount;
                const nextBatch = Math.min(ICONS_PER_PAGE, remaining);
                loadMoreBtn.innerHTML = `<i class="fas fa-plus-circle"></i> Load More (${nextBatch})`;
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        // ================================================================
        //  7. EVENT LISTENERS
        // ================================================================

        // Category buttons
        document.querySelectorAll('#categoryFilter button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#categoryFilter button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.cat;
                visibleCount = 0;
                renderIcons(ICONS_PER_PAGE);
            });
        });

        // Search input
        searchInput.addEventListener('input', function() {
            searchTerm = this.value;
            visibleCount = 0;
            renderIcons(ICONS_PER_PAGE);
        });

        // Load more
        loadMoreBtn.addEventListener('click', function() {
            renderIcons(ICONS_PER_PAGE);
        });

        // ================================================================
        //  8. INITIAL RENDER
        // ================================================================

        renderIcons(ICONS_PER_PAGE);

        console.log(`✅ Transportation Icon Library loaded with ${allIcons.length} unique transportation icons`);
        console.log(`📂 Categories: ${uniqueCats.length}`);
    })();
